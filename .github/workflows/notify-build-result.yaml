# davidfuzju: the daily build runs unattended. A failed run opens (or comments
# on) one `build-failure` issue, so GitHub notifies the repository owner; the
# next successful run closes it.
name: Notify build result

on:
  workflow_run:
    workflows: [Build and push Docker images]
    types: [completed]

permissions:
  issues: write

jobs:
  notify:
    name: Notify
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open, comment on, or close the build-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          open=$(gh issue list --label build-failure --state open --json number --jq '.[0].number // empty')
          if [ "$CONCLUSION" = failure ]; then
            body="Image build failed (${EVENT}, ${HEAD_SHA:0:7}): ${RUN_URL}"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --label build-failure --title "Image build failing" \
                --body "$body"$'\n\n'"Find the cause with: gh run view <id> --log-failed | grep -E 'error:|Error [0-9]|has to install|requires the module'"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Build succeeded again: ${RUN_URL}"
          fi
